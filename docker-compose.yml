version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: incident_system_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-incident_system}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident_system_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-incident_system}}
      SECRET_KEY: ${SECRET_KEY:-random-key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-975957913940-d3f3qr6p4k6r619gmaa15m82se69h6v5.apps.googleusercontent.com}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/app/__pycache__

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-975957913940-d3f3qr6p4k6r619gmaa15m82se69h6v5.apps.googleusercontent.com}
    container_name: incident_system_frontend
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: